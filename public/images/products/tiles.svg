<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28323A" />
      <stop offset="100%" stop-color="#17191C" />
    </linearGradient>
    <linearGradient id="marbleTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <linearGradient id="accentTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#tileBg)" />

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="510" rx="210" ry="24" fill="#000" opacity="0.6" />

  <!-- Showcase Isometric Tile 1 (Left White Marble) -->
  <g transform="translate(60, 40)" filter="url(#tileShadow)">
    <polygon points="120,250 280,170 380,220 220,300" fill="url(#marbleTile)" stroke="#D1D5DB" stroke-width="2" />
    <polygon points="120,250 220,300 220,316 120,266" fill="#9CA3AF" />
    <polygon points="220,300 380,220 380,236 220,316" fill="#6B7280" />
    <!-- Delicate Marble Veins -->
    <path d="M150 240 Q 210 210 240 230 T 320 200" stroke="#9CA3AF" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M220 260 Q 250 240 280 250 T 350 215" stroke="#D1D5DB" stroke-width="1.5" fill="none" opacity="0.8" />
  </g>

  <!-- Showcase Isometric Tile 2 (Front Center - Slate) -->
  <g transform="translate(140, 110)" filter="url(#tileShadow)">
    <polygon points="120,250 280,170 380,220 220,300" fill="url(#accentTile)" stroke="#F28C28" stroke-width="1.5" />
    <polygon points="120,250 220,300 220,316 120,266" fill="#17191C" />
    <polygon points="220,300 380,220 380,236 220,316" fill="#0F1113" />
    <!-- Glossy Highlight -->
    <polygon points="160,230 260,180 340,220 240,270" fill="#FFFFFF" opacity="0.08" />
  </g>

  <!-- Specs Badge -->
  <rect x="50" y="60" width="180" height="42" rx="4" fill="#17191C" stroke="#F28C28" stroke-width="1.5" />
  <text x="140" y="87" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">PORCELAIN TILES</text>
  <text x="140" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" text-anchor="middle">24"x24" NANO POLISH</text>
</svg>

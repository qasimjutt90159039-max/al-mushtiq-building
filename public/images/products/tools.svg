<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="toolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28323A" />
      <stop offset="100%" stop-color="#17191C" />
    </linearGradient>
    <linearGradient id="steelHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="40%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <linearGradient id="yellowGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F28C28" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#toolBg)" />

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="510" rx="190" ry="24" fill="#000" opacity="0.6" />

  <!-- Diagonal Heavy Claw Hammer -->
  <g transform="rotate(-35 300 300)">
    <!-- Handle -->
    <rect x="285" y="160" width="30" height="340" rx="12" fill="url(#yellowGrip)" stroke="#17191C" stroke-width="2" />
    <!-- Textured Rubber Grips -->
    <rect x="282" y="320" width="36" height="170" rx="10" fill="#17191C" />
    <line x1="282" y1="350" x2="318" y2="350" stroke="#F28C28" stroke-width="3" />
    <line x1="282" y1="380" x2="318" y2="380" stroke="#F28C28" stroke-width="3" />
    <line x1="282" y1="410" x2="318" y2="410" stroke="#F28C28" stroke-width="3" />
    <line x1="282" y1="440" x2="318" y2="440" stroke="#F28C28" stroke-width="3" />
    <line x1="282" y1="470" x2="318" y2="470" stroke="#F28C28" stroke-width="3" />

    <!-- Forged Steel Hammer Head -->
    <path d="M210 135 L330 135 L345 155 L385 155 L385 185 L345 185 L330 205 L260 205 C 230 195, 210 170, 190 200 C 195 160, 205 145, 210 135 Z" fill="url(#steelHead)" stroke="#1F2937" stroke-width="2" />
    <!-- Striking Face Rim -->
    <rect x="385" y="152" width="12" height="36" rx="2" fill="#E5E7EB" stroke="#4B5563" />
  </g>

  <!-- Professional Measuring Tape in Corner -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="120" height="110" rx="24" fill="#F28C28" stroke="#17191C" stroke-width="3" />
    <rect x="20" y="20" width="80" height="70" rx="16" fill="#17191C" />
    <text x="60" y="62" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle">8M</text>
    <rect x="110" y="65" width="30" height="14" fill="#FDE047" stroke="#000" />
  </g>

  <!-- Spec Badge -->
  <rect x="50" y="60" width="170" height="42" rx="4" fill="#17191C" stroke="#F28C28" stroke-width="1.5" />
  <text x="135" y="87" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">CONTRACTOR TOOLS</text>
  <text x="135" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" text-anchor="middle">PROFESSIONAL GRADE</text>
</svg>

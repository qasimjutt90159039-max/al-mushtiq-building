<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="plumbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28323A" />
      <stop offset="100%" stop-color="#17191C" />
    </linearGradient>
    <linearGradient id="pvcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <linearGradient id="pprGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#plumbBg)" />

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <ellipse cx="300" cy="510" rx="200" ry="24" fill="#000" opacity="0.6" />

  <!-- 4" White PVC Pipe Section -->
  <g transform="rotate(-30 250 320)">
    <rect x="80" y="270" width="380" height="60" rx="8" fill="url(#pvcGrad)" stroke="#4B5563" stroke-width="2" />
    <!-- Socket Ring on Pipe -->
    <rect x="70" y="265" width="40" height="70" rx="4" fill="#F3F4F6" stroke="#4B5563" stroke-width="2" />
    <text x="260" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#4B5563" letter-spacing="3">POPULAR PVC CLASS-B 4"</text>
  </g>

  <!-- Green PPR Pipe Section -->
  <g transform="rotate(35 320 280)">
    <rect x="150" y="250" width="340" height="40" rx="6" fill="url(#pprGrad)" stroke="#064E3B" stroke-width="2" />
    <line x1="150" y1="270" x2="490" y2="270" stroke="#EF4444" stroke-width="3" />
    <text x="320" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="2">PN20 HOT &amp; COLD</text>
  </g>

  <!-- Brass Ball Valve (Foreground Center) -->
  <g transform="translate(230, 240)">
    <!-- Valve Body -->
    <rect x="30" y="50" width="90" height="50" rx="8" fill="url(#brassGrad)" stroke="#78350F" stroke-width="2" />
    <rect x="15" y="45" width="25" height="60" rx="4" fill="url(#brassGrad)" stroke="#78350F" stroke-width="2" />
    <rect x="110" y="45" width="25" height="60" rx="4" fill="url(#brassGrad)" stroke="#78350F" stroke-width="2" />
    <!-- Valve Stem -->
    <rect x="65" y="25" width="20" height="30" rx="3" fill="url(#brassGrad)" stroke="#78350F" stroke-width="2" />
    <!-- Orange Valve Lever -->
    <rect x="65" y="15" width="110" height="18" rx="4" fill="#F28C28" stroke="#17191C" stroke-width="2" />
    <circle cx="75" cy="24" r="5" fill="#17191C" />
  </g>

  <!-- Spec Label -->
  <rect x="50" y="70" width="180" height="42" rx="4" fill="#17191C" stroke="#F28C28" stroke-width="1.5" />
  <text x="140" y="97" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">PIPES &amp; FITTINGS</text>
  <text x="140" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" text-anchor="middle">PVC &amp; PPR PN20 RATED</text>
</svg>

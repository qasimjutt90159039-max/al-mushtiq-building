<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="elecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28323A" />
      <stop offset="100%" stop-color="#17191C" />
    </linearGradient>
    <linearGradient id="copperCoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="copperShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#elecBg)" />

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="500" rx="200" ry="26" fill="#000" opacity="0.6" />

  <!-- Wire Coil Ring -->
  <ellipse cx="300" cy="380" rx="170" ry="85" fill="none" stroke="url(#copperCoil)" stroke-width="50" stroke-dasharray="14 4" />
  <ellipse cx="300" cy="370" rx="155" ry="75" fill="none" stroke="#DC2626" stroke-width="35" opacity="0.9" />

  <!-- Exposed Stripped Copper Strands -->
  <g transform="translate(180, 220)">
    <path d="M40 180 Q 20 80 80 40" fill="none" stroke="#DC2626" stroke-width="24" stroke-linecap="round" />
    <!-- Bright Copper Conductor Core -->
    <path d="M80 40 Q 110 20 150 15" fill="none" stroke="url(#copperShine)" stroke-width="12" stroke-linecap="round" />
    <circle cx="155" cy="15" r="7" fill="#FDE68A" />
  </g>

  <!-- Modern Switch Faceplate in Background -->
  <g transform="translate(320, 160)">
    <rect x="0" y="0" width="160" height="150" rx="12" fill="#1F2937" stroke="#374151" stroke-width="3" />
    <!-- Switches -->
    <rect x="25" y="30" width="30" height="50" rx="4" fill="#111827" stroke="#4B5563" />
    <rect x="25" y="30" width="30" height="24" rx="3" fill="#F28C28" />
    <rect x="65" y="30" width="30" height="50" rx="4" fill="#111827" stroke="#4B5563" />
    <rect x="65" y="55" width="30" height="24" rx="3" fill="#374151" />
    <!-- Socket -->
    <circle cx="125" cy="55" r="18" fill="#111827" stroke="#4B5563" />
    <circle cx="120" cy="50" r="3" fill="#000" />
    <circle cx="130" cy="50" r="3" fill="#000" />
    <circle cx="125" cy="62" r="3" fill="#000" />
  </g>

  <!-- Technical Spec Badge -->
  <rect x="50" y="60" width="190" height="42" rx="4" fill="#17191C" stroke="#F4B942" stroke-width="1.5" />
  <text x="145" y="87" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">99.9% PURE COPPER</text>
  <text x="145" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" text-anchor="middle">CERTIFIED CABLES &amp; GEAR</text>
</svg>

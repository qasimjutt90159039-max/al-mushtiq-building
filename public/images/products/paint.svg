<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pntBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28323A" />
      <stop offset="100%" stop-color="#17191C" />
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="40%" stop-color="#9CA3AF" />
      <stop offset="70%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <linearGradient id="paintOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#D95338" />
    </linearGradient>
    <filter id="pntShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#pntBg)" />

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="510" rx="170" ry="24" fill="#000" opacity="0.6" />

  <!-- Paint Bucket / Drum -->
  <g filter="url(#pntShadow)">
    <!-- Main Cylinder Body -->
    <path d="M190 220 L210 480 Q 300 500 390 480 L410 220 Z" fill="url(#canGrad)" stroke="#1F2937" stroke-width="2" />
    
    <!-- Top Rim Ellipse -->
    <ellipse cx="300" cy="220" rx="110" ry="25" fill="#E5E7EB" stroke="#6B7280" stroke-width="3" />
    <!-- Inner Rim with Paint Pool -->
    <ellipse cx="300" cy="220" rx="96" ry="18" fill="url(#paintOrange)" />

    <!-- Label Banner on Can -->
    <path d="M197 290 L203 420 Q 300 440 397 420 L403 290 Q 300 270 197 290 Z" fill="#17191C" />

    <!-- Label Text -->
    <text x="300" y="340" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WEATHERCOAT</text>
    <text x="300" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#F28C28" text-anchor="middle" letter-spacing="2">EXTERIOR ACRYLIC</text>
    <text x="300" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" text-anchor="middle">16 LITERS DRUM</text>

    <!-- Chrome Wire Handle -->
    <path d="M185 240 Q 300 90 415 240" fill="none" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round" />
    <circle cx="185" cy="240" r="7" fill="#4B5563" />
    <circle cx="415" cy="240" r="7" fill="#4B5563" />
  </g>
</svg>

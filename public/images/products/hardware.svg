<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28323A" />
      <stop offset="100%" stop-color="#17191C" />
    </linearGradient>
    <linearGradient id="brassPadlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D1D5DB" />
      <stop offset="50%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="hingeSS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#hardBg)" />

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <ellipse cx="300" cy="510" rx="200" ry="24" fill="#000" opacity="0.6" />

  <!-- Stainless Steel Door Hinge (Left) -->
  <g transform="translate(100, 200)">
    <!-- Hinge Left Leaf -->
    <rect x="0" y="20" width="70" height="200" rx="4" fill="url(#hingeSS)" stroke="#374151" stroke-width="2" />
    <!-- Screw Holes -->
    <circle cx="35" cy="50" r="7" fill="#1F2937" stroke="#4B5563" />
    <circle cx="35" cy="120" r="7" fill="#1F2937" stroke="#4B5563" />
    <circle cx="35" cy="190" r="7" fill="#1F2937" stroke="#4B5563" />
    <!-- Pin / Knuckle -->
    <rect x="65" y="10" width="16" height="220" rx="8" fill="#D1D5DB" stroke="#1F2937" stroke-width="2" />
    <!-- Right Leaf -->
    <rect x="76" y="20" width="70" height="200" rx="4" fill="url(#hingeSS)" stroke="#374151" stroke-width="2" />
    <circle cx="115" cy="50" r="7" fill="#1F2937" stroke="#4B5563" />
    <circle cx="115" cy="120" r="7" fill="#1F2937" stroke="#4B5563" />
    <circle cx="115" cy="190" r="7" fill="#1F2937" stroke="#4B5563" />
  </g>

  <!-- Heavy Solid Brass Padlock (Right Foreground) -->
  <g transform="translate(320, 210)">
    <!-- Hardened Steel Shackle -->
    <path d="M45 130 L45 70 C 45 15, 145 15, 145 70 L145 130" fill="none" stroke="url(#shackleGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Brass Body -->
    <rect x="15" y="120" width="160" height="150" rx="16" fill="url(#brassPadlock)" stroke="#78350F" stroke-width="3" />
    <!-- Security Cylinder Keyhole -->
    <circle cx="95" cy="190" r="14" fill="#17191C" />
    <polygon points="90,195 100,195 104,225 86,225" fill="#17191C" />
    <!-- Brand Stamp -->
    <text x="95" y="155" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="14" fill="#78350F" text-anchor="middle" letter-spacing="1">MASTER 60MM</text>
  </g>

  <!-- Spec Badge -->
  <rect x="50" y="60" width="190" height="42" rx="4" fill="#17191C" stroke="#F4B942" stroke-width="1.5" />
  <text x="145" y="87" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">HARDWARE &amp; LOCKS</text>
  <text x="145" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#9CA3AF" text-anchor="middle">SOLID BRASS &amp; SS 304</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1113" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="85%" stop-color="#374151" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <linearGradient id="glowWarm" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F28C28" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#F4B942" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="steelBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="675" fill="url(#skyGrad)" />
  <rect width="1200" height="675" fill="url(#glowWarm)" />

  <!-- Architectural Blueprint Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Distant Building Silhouettes & Structure Framework -->
  <g fill="#111827" opacity="0.7">
    <rect x="750" y="160" width="140" height="515" />
    <rect x="910" y="240" width="180" height="435" />
    <rect x="620" y="320" width="110" height="355" />
  </g>

  <!-- Tower Crane Silhouettes -->
  <g stroke="#F28C28" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <!-- Crane Mast -->
    <line x1="880" y1="80" x2="880" y2="520" stroke-width="5" />
    <line x1="860" y1="120" x2="880" y2="100" />
    <line x1="880" y1="100" x2="900" y2="120" />
    <line x1="860" y1="160" x2="880" y2="140" />
    <line x1="880" y1="140" x2="900" y2="160" />
    <line x1="860" y1="200" x2="880" y2="180" />
    <line x1="880" y1="180" x2="900" y2="200" />
    <line x1="860" y1="240" x2="880" y2="220" />
    <line x1="880" y1="220" x2="900" y2="240" />

    <!-- Crane Jib (Horizontal Arm) -->
    <line x1="640" y1="80" x2="1140" y2="80" stroke-width="4" />
    <!-- Counter Jib Ties -->
    <line x1="880" y1="20" x2="680" y2="80" stroke-width="2" />
    <line x1="880" y1="20" x2="1000" y2="80" stroke-width="2" />
    <line x1="880" y1="20" x2="880" y2="80" stroke-width="4" />
    <!-- Hoist Cable with Hook -->
    <line x1="1060" y1="80" x2="1060" y2="220" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 2" />
    <circle cx="1060" cy="225" r="5" fill="#F4B942" />
  </g>

  <!-- Foreground Structural Girders and Concrete Floors -->
  <g fill="#17191C" stroke="#28323A" stroke-width="2">
    <!-- Ground / Slab -->
    <polygon points="0,520 1200,480 1200,675 0,675" fill="#17191C" />
    <polygon points="500,440 1200,380 1200,410 500,470" fill="#28323A" />
  </g>

  <!-- Stacked Cement Bags on Pallet (Foreground Right) -->
  <g transform="translate(760, 430)">
    <rect x="0" y="100" width="220" height="20" rx="2" fill="#78350F" />
    <!-- Pallet slats -->
    <rect x="10" y="100" width="30" height="20" fill="#451A03" />
    <rect x="95" y="100" width="30" height="20" fill="#451A03" />
    <rect x="180" y="100" width="30" height="20" fill="#451A03" />

    <!-- Tier 1 Bags -->
    <rect x="10" y="70" width="95" height="30" rx="4" fill="#D1D5DB" stroke="#4B5563" />
    <rect x="110" y="70" width="95" height="30" rx="4" fill="#E5E7EB" stroke="#4B5563" />
    <rect x="40" y="78" width="40" height="14" fill="#F28C28" />
    <rect x="140" y="78" width="40" height="14" fill="#F28C28" />

    <!-- Tier 2 Bags -->
    <rect x="15" y="42" width="95" height="30" rx="4" fill="#E5E7EB" stroke="#4B5563" />
    <rect x="105" y="42" width="95" height="30" rx="4" fill="#D1D5DB" stroke="#4B5563" />
    <rect x="45" y="50" width="40" height="14" fill="#F28C28" />
    <rect x="135" y="50" width="40" height="14" fill="#F28C28" />

    <!-- Tier 3 Top Bag -->
    <rect x="60" y="14" width="100" height="30" rx="4" fill="#F3F4F6" stroke="#4B5563" />
    <rect x="90" y="22" width="40" height="14" fill="#F28C28" />
  </g>

  <!-- Steel Rebar Bundles Foreground (Center Left) -->
  <g transform="translate(480, 510) rotate(-10)">
    <rect x="0" y="0" width="280" height="16" rx="8" fill="#4B5563" stroke="#9CA3AF" />
    <rect x="10" y="14" width="270" height="16" rx="8" fill="#374151" stroke="#6B7280" />
    <rect x="-10" y="28" width="290" height="18" rx="9" fill="#1F2937" stroke="#4B5563" />
    <!-- Yellow Strapping Bands -->
    <rect x="50" y="-2" width="10" height="50" fill="#F59E0B" />
    <rect x="200" y="-2" width="10" height="50" fill="#F59E0B" />
  </g>

  <!-- Foreground Architectural Accent Lines -->
  <line x1="0" y1="520" x2="1200" y2="480" stroke="#F28C28" stroke-width="3" opacity="0.6" />
</svg>
